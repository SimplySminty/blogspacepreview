<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css"> <!-- link to CSS file -->
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <section class="card">
  <section class="card__image-container">
    <img src="assets\images\image-article.jpg" alt="Image of a person reading an article" class="card__image">
  <img src="assets\images\illustration-article.svg" alt="Illustration of a person reading an article" class="card__image">
  </section>
  <section class="card__header">
  <p class='header__title'>Learning</p>
  <p class='header__date'>Published 21 Dec 2023</p>
  </section>
  <section class="card__content">
  <p class='content_title'>HTML & CSS foundations</p>

  <p class='content_description'>These languages are the backbone of every website, defining structure, content, and presentation.</p>
</section>  
<section class="card_footer">
  <img src="assets\images\image-avatar.webp" alt="Avatar of the author" class="card__avatar">
  <p class='card_author'>Greg Hooper</p>
</section>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Sarah</a>.
  </div>
</body>
</html>
